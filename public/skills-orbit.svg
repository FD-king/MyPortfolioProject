<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 896 655" width="896" height="655" role="img" aria-label="Skills orbit graphic">
  <defs>
    <style>
      /* ---- edit colors here ---- */
      .page-bg   { fill:#100425; }          /* delete the page-bg rect below for a transparent background */
      .badge     { fill:#251C31; }          /* logo circle */
      .beam      { fill:none; stroke:#3D1668; stroke-width:1; }
      .ring      { fill:none; stroke:#763CAC; stroke-width:1; }
      .inner     { fill:none; stroke:#763CAC; stroke-width:1; opacity:.85; }
      .ico       { fill:#693B93; opacity:.85; }
      .ico-s     { fill:none; stroke:#693B93; stroke-width:1.3; opacity:.85; stroke-linecap:round; stroke-linejoin:round; }
      .ico-t     { fill:#100425; font:700 8px Arial,sans-serif; text-anchor:middle; }
      .ico-l     { fill:#693B93; font:700 8px Arial,sans-serif; text-anchor:middle; opacity:.85; }
    </style>

    <!-- halo: vertical color (magenta -> blue -> cyan), faded by a radial mask -->
    <linearGradient id="haloColor" gradientUnits="userSpaceOnUse" x1="0" y1="440" x2="0" y2="650">
      <stop offset="0"   stop-color="#D01FD8"/>
      <stop offset=".38" stop-color="#CC23DA"/>
      <stop offset=".50" stop-color="#B256E1"/>
      <stop offset=".62" stop-color="#A07AE8"/>
      <stop offset=".73" stop-color="#8F9FEF"/>
      <stop offset=".85" stop-color="#7BC1F6"/>
      <stop offset=".96" stop-color="#5DE8E8"/>
    </linearGradient>
    <radialGradient id="haloFade" cx="50%" cy="50%" r="50%">
      <stop offset="0"   stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".5"  stop-color="#fff" stop-opacity=".26"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".10"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="haloMask"><ellipse cx="455" cy="500" rx="275" ry="160" fill="url(#haloFade)"/></mask>
    <clipPath id="noOrb"><path clip-rule="evenodd" d="M0 0H896V655H0Z M530 440A90 90 0 1 0 350 440A90 90 0 1 0 530 440Z"/></clipPath>

    <!-- orb: see-through glass gradient (cyan -> lavender -> magenta) -->
    <linearGradient id="orbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.03" stop-color="#68EBFC" stop-opacity="0.328"/>
      <stop offset=".12" stop-color="#70D9FA" stop-opacity="0.370"/>
      <stop offset=".19" stop-color="#78C7F5" stop-opacity="0.389"/>
      <stop offset=".26" stop-color="#93BEF4" stop-opacity="0.437"/>
      <stop offset=".32" stop-color="#98A9F0" stop-opacity="0.446"/>
      <stop offset=".39" stop-color="#958FEB" stop-opacity="0.432"/>
      <stop offset=".46" stop-color="#9F7BE8" stop-opacity="0.446"/>
      <stop offset=".52" stop-color="#A768E4" stop-opacity="0.465"/>
      <stop offset=".59" stop-color="#AF58E1" stop-opacity="0.475"/>
      <stop offset=".66" stop-color="#B948E0" stop-opacity="0.484"/>
      <stop offset=".72" stop-color="#C754E2" stop-opacity="0.528"/>
      <stop offset=".79" stop-color="#C73FDD" stop-opacity="0.513"/>
      <stop offset=".86" stop-color="#C32ED9" stop-opacity="0.475"/>
      <stop offset=".92" stop-color="#C42EDB" stop-opacity="0.456"/>
      <stop offset=".99" stop-color="#B54AE0" stop-opacity="0.332"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect class="page-bg" width="896" height="655"/>
  <ellipse cx="455" cy="500" rx="275" ry="160" fill="url(#haloColor)" mask="url(#haloMask)" clip-path="url(#noOrb)"/>

  <!-- ============ beams: logos -> orb ============ -->
  <g id="beams">
    <path class="beam" opacity="0.57" d="M277 44 C277 194 402 290 424 385"/>
    <path class="beam" opacity="0.64" d="M332 44 C332 194 414 290 428 385"/>
    <path class="beam" opacity="0.71" d="M387 44 C387 194 424 290 431 385"/>
    <path class="beam" opacity="0.79" d="M445 44 C445 194 436 290 435 385"/>
    <path class="beam" opacity="0.86" d="M496 44 C496 194 448 290 439 385"/>
    <path class="beam" opacity="0.93" d="M553 44 C553 194 462 290 446 385"/>
    <path class="beam" opacity="1.00" d="M607 44 C607 194 475 290 452 385"/>
    <path class="beam" opacity="0.93" d="M305 105 C305 255 434 290 457 385"/>
    <path class="beam" opacity="0.86" d="M365 105 C365 255 447 290 461 385"/>
    <path class="beam" opacity="0.79" d="M417 105 C417 255 448 290 454 385"/>
    <path class="beam" opacity="0.71" d="M472 105 C472 255 452 290 448 385"/>
    <path class="beam" opacity="0.64" d="M531 105 C531 255 455 290 442 385"/>
    <path class="beam" opacity="0.57" d="M586 105 C586 255 458 290 436 385"/>
  </g>

  <!-- ============ orbit rings ============ -->
  <g id="rings" transform="translate(-20 354.2) scale(.835 .78)">
    <ellipse class="ring" cx="561" cy="175" rx="534" ry="163"/>
    <ellipse class="ring" cx="566" cy="176" rx="462" ry="161"/>
    <ellipse class="ring" cx="580" cy="177" rx="420" ry="160"/>
  </g>
  <g id="inner-rings" transform="translate(3.2 354.2) scale(.78)">
    <ellipse class="inner" cx="566" cy="125" rx="178" ry="108"/>
    <ellipse class="inner" cx="570" cy="128" rx="162" ry="130"/>
  </g>

  <!-- ============ central orb ============ -->
  <g id="orb">
    <circle cx="440" cy="440" r="90" fill="url(#orbGrad)"/>
    <g id="sigma" transform="translate(440 440) scale(.826)" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="10">
      <g filter="url(#glow)" opacity=".85"><path d="M-40 -48H42"/><path d="M10 -46L-28 0L8 48"/><path d="M-40 51H42"/></g>
      <path d="M-40 -48H42"/><path d="M10 -46L-28 0L8 48"/><path d="M-40 51H42"/>
    </g>
  </g>

  <!-- ============ small icons on the rings ============ -->
  <g id="icons">
    <g id="icon-ai" transform="translate(193 394)"><rect class="ico-s" x="-6" y="-8" width="12" height="16" rx="1"/><text class="ico-l" y="3" style="font-size:6px">Ai</text></g>
    <g id="icon-linkedin" transform="translate(88 432)"><rect class="ico" x="-7" y="-7" width="14" height="14" rx="2"/><text class="ico-t" y="3.5" style="font-size:8px">in</text></g>
    <g id="icon-gatsby" transform="translate(127 489)"><circle class="ico" r="8"/><text class="ico-t" y="3" style="font-size:9px">G</text></g>
    <g id="icon-css" transform="translate(34 560)"><path class="ico" d="M-7 -7H7L5.7 7L0 9L-5.7 7Z"/><text class="ico-t" y="3.5" style="font-size:8px">3</text><text class="ico-l" y="-10" style="font-size:5px">CSS</text></g>
    <g id="icon-bird" transform="translate(138 566)"><path class="ico" d="M-10 -8L-1 -2L6 -5L10 -2L3 2L-2 10L-4 4Z"/></g>
    <g id="icon-code" transform="translate(718 421)"><path class="ico-s" style="stroke-width:2.6" d="M-3.5 -5L-9 0L-3.5 5M3.5 -5L9 0L3.5 5"/></g>
    <g id="icon-js" transform="translate(777 415)"><rect class="ico" x="-7" y="-8" width="14" height="16" rx="2"/><text class="ico-t" y="3.5" style="font-size:7px">JS</text></g>
    <g id="icon-react" transform="translate(842 449)"><ellipse class="ico-s" rx="10" ry="4"/><ellipse class="ico-s" rx="10" ry="4" transform="rotate(60)"/><ellipse class="ico-s" rx="10" ry="4" transform="rotate(120)"/><circle class="ico" r="1.8"/></g>
    <g id="icon-xd" transform="translate(832 518)"><rect class="ico" x="-7.5" y="-7.5" width="15" height="15" rx="2"/><text class="ico-t" y="3" style="font-size:7px">Xd</text></g>
    <g id="icon-node" transform="translate(886 501)"><path class="ico-s" d="M0 -11L9.5 -5.5V5.5L0 11L-9.5 5.5V-5.5Z"/><text class="ico-l" y="3" style="font-size:7px">JS</text></g>
    <g id="icon-figma" transform="translate(771 587) scale(.34) translate(-19 -28.5)"><g fill="none" stroke="#693B93" stroke-width="3.5" opacity=".85"><path d="M9.5 0H19V19H9.5A9.5 9.5 0 0 1 9.5 0Z"/><path d="M19 0H28.5A9.5 9.5 0 0 1 28.5 19H19Z"/><path d="M9.5 19H19V38H9.5A9.5 9.5 0 0 1 9.5 19Z"/><circle cx="28.5" cy="28.5" r="9.5"/><path d="M9.5 38H19V47.5A9.5 9.5 0 1 1 9.5 38Z"/></g></g>
  </g>

  <!-- ============ TOP LOGOS ============
       Each slot = badge circle + <g id="logo-NAME">.
       To swap a logo: replace everything inside its logo-NAME group (100x100 space), e.g.
       <image href="my-logo.svg" x="20" y="20" width="60" height="60"/>
       Move a slot: edit translate(x y).   Resize all logos: change scale(.45). -->
  <g id="logos">

    <g id="slot-figma" transform="translate(277 22) scale(.45) translate(-50 -50)">
      <circle class="badge" cx="50" cy="50" r="48"/>
      <g id="logo-figma">
        <g transform="translate(35.2 28) scale(.78)">
          <path fill="#F24E1E" d="M9.5 0H19V19H9.5A9.5 9.5 0 0 1 9.5 0Z"/>
          <path fill="#FF7262" d="M19 0H28.5A9.5 9.5 0 0 1 28.5 19H19Z"/>
          <path fill="#A259FF" d="M9.5 19H19V38H9.5A9.5 9.5 0 0 1 9.5 19Z"/>
          <circle fill="#1ABCFE" cx="28.5" cy="28.5" r="9.5"/>
          <path fill="#0ACF83" d="M9.5 38H19V47.5A9.5 9.5 0 1 1 9.5 38Z"/>
        </g>
      </g>
    </g>

    <g id="slot-react" transform="translate(332 22) scale(.45) translate(-50 -50)">
      <circle class="badge" cx="50" cy="50" r="48"/>
      <g id="logo-react">
        <g fill="none" stroke="#61DAFB" stroke-width="3" transform="translate(50 50)">
          <ellipse rx="31" ry="12"/>
          <ellipse rx="31" ry="12" transform="rotate(60)"/>
          <ellipse rx="31" ry="12" transform="rotate(120)"/>
          <circle r="4.5" fill="#61DAFB" stroke="none"/>
        </g>
      </g>
    </g>

    <g id="slot-c" transform="translate(387 22) scale(.45) translate(-50 -50)">
      <circle class="badge" cx="50" cy="50" r="48"/>
      <g id="logo-c">
        <polygon points="50,12 83,31 83,69 50,88 17,69 17,31" fill="#00599C" stroke="#00599C" stroke-width="4" stroke-linejoin="round"/>
        <polygon points="50,12 50,88 17,69 17,31" fill="#659AD2" stroke="#659AD2" stroke-width="4" stroke-linejoin="round"/>
        <polygon points="50,12 83,31 83,69 50,88" fill="#00599C"/>
        <path d="M63 39.5A17.5 17.5 0 1 0 63 60.5" fill="none" stroke="#fff" stroke-width="9"/>
      </g>
    </g>

    <g id="slot-node" transform="translate(445 22) scale(.45) translate(-50 -50)">
      <circle class="badge" cx="50" cy="50" r="48"/>
      <g id="logo-node">
        <text x="50" y="47" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="21" fill="#fff" letter-spacing="-.5">node</text>
        <g transform="translate(60 61)">
          <polygon points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5" fill="#539E43"/>
          <text y="3" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="7.5" fill="#0e2a0a">JS</text>
        </g>
      </g>
    </g>

    <g id="slot-redux" transform="translate(496 22) scale(.45) translate(-50 -50)">
      <circle class="badge" cx="50" cy="50" r="48"/>
      <g id="logo-redux">
        <g fill="none" stroke="#764ABC" stroke-width="4.2" stroke-linecap="round">
          <circle cx="50" cy="26" r="7"/>
          <circle cx="27" cy="64" r="7"/>
          <circle cx="73" cy="64" r="7"/>
          <path d="M50 33C52 50 43 60 34 62"/>
          <path d="M34 66C50 76 66 74 66 68"/>
          <path d="M69 58C62 46 56 36 56 31"/>
          <path d="M43 28C30 32 22 44 22 56"/>
          <path d="M30 71C40 84 62 86 76 72"/>
          <path d="M77 59C80 44 72 30 57 26"/>
        </g>
      </g>
    </g>

    <g id="slot-javascript" transform="translate(553 22) scale(.45) translate(-50 -50)">
      <circle class="badge" cx="50" cy="50" r="48"/>
      <g id="logo-javascript">
        <rect x="26" y="26" width="48" height="48" fill="#F0DB4F"/>
        <text x="71" y="70" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="21" fill="#323330">JS</text>
      </g>
    </g>

    <g id="slot-css3" transform="translate(607 22) scale(.45) translate(-50 -50)">
      <circle class="badge" cx="50" cy="50" r="48"/>
      <g id="logo-css3">
        <path d="M24 14H76L71.5 76L50 86L28.5 76Z" fill="#1572B6"/>
        <path d="M50 80.5V19.5H71L67.2 72.8Z" fill="#33A9DC"/>
        <text x="50" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="6.5" fill="#fff">CSS</text>
        <text x="50" y="66" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="42" fill="#fff">3</text>
      </g>
    </g>

    <g id="slot-xd" transform="translate(305 83) scale(.45) translate(-50 -50)">
      <circle class="badge" cx="50" cy="50" r="48"/>
      <g id="logo-xd">
        <rect x="21" y="21" width="58" height="58" rx="6" fill="#2E001E" stroke="#FF2BC2" stroke-width="3"/>
        <text x="50" y="60" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="30" fill="#FF2BC2">Xd</text>
      </g>
    </g>

    <g id="slot-nextjs" transform="translate(365 83) scale(.45) translate(-50 -50)">
      <circle class="badge" cx="50" cy="50" r="48"/>
      <g id="logo-nextjs">
        <text x="46" y="55" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="300" font-size="18" fill="#e6e6e6" letter-spacing="-.5">NEXT</text>
        <text x="68" y="55" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-weight="400" font-size="6" fill="#e6e6e6">.js</text>
      </g>
    </g>

    <g id="slot-gatsby" transform="translate(417 83) scale(.45) translate(-50 -50)">
      <circle class="badge" cx="50" cy="50" r="48"/>
      <g id="logo-gatsby">
        <circle cx="50" cy="50" r="30" fill="#663399"/>
        <path d="M70 38A22 22 0 1 0 71 55H51" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
      </g>
    </g>

    <g id="slot-illustrator" transform="translate(472 83) scale(.45) translate(-50 -50)">
      <circle class="badge" cx="50" cy="50" r="48"/>
      <g id="logo-illustrator">
        <rect x="21" y="21" width="58" height="58" rx="6" fill="#261300" stroke="#F07400" stroke-width="3"/>
        <text x="50" y="60" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="30" fill="#F07400">Ai</text>
      </g>
    </g>

    <g id="slot-express" transform="translate(531 83) scale(.45) translate(-50 -50)">
      <circle class="badge" cx="50" cy="50" r="48"/>
      <g id="logo-express">
        <text x="50" y="55" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="300" font-size="16" fill="#e0e0e0" letter-spacing="-.3">express</text>
      </g>
    </g>

    <g id="slot-mongodb" transform="translate(586 83) scale(.45) translate(-50 -50)">
      <circle class="badge" cx="50" cy="50" r="48"/>
      <g id="logo-mongodb">
        <path d="M13 66C9 54 11 42 17 30C23 42 24 54 17 66Z" fill="#13AA52"/>
        <path d="M17 30V70" stroke="#0b2b12" stroke-width="1.2"/>
        <text x="27" y="54" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="11" fill="#fff" letter-spacing="-.4">mongoDB</text>
      </g>
    </g>

  </g>
</svg>